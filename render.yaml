# Render 部署配置 — 薄荷随笔后端（免费实例版）
# 免费实例不支持持久磁盘，数据库/图片会在重新部署后重置，属于演示级方案。
# 需要长期保留数据 → 改用 Fly.io volume，或把数据库换成 Supabase Postgres。
services:
  - name: mint-blog-api
    type: web
    env: node
    rootDir: blog-backend
    buildCommand: npm install
    startCommand: node src/app.js
    plan: free # 512MB 内存，15 分钟无访问休眠
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        sync: false # Dashboard 手动填：node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      - key: CORS_ORIGIN
        sync: false # 填前端地址，如 https://perlogss.netlify.app
      - key: PUBLIC_BASE
        sync: false # RSS 里文章链接用的前端地址，同上
